name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DNS protocol test dependencies
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd bsdextrautils
      - name: Shell syntax
        run: sh -n netctl.sh && sh -n install.sh
      - name: Isolated regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Integration runner CLI
        run: python3 tests/live.py --help
